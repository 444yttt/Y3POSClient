name: BeReal bonus metadata synthetic checks
on:
  push:
    branches: [codex/bereal-bonus-metadata-20261127]
    paths:
      - scripts/inspect_bonus_metadata.py
      - tests/test_inspect_bonus_metadata.py
      - .github/workflows/bereal-bonus-metadata.yml
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile standard-library-only parser and tests
        run: python3 -m py_compile scripts/inspect_bonus_metadata.py tests/test_inspect_bonus_metadata.py
      - name: Test synthetic metadata, input pins and unsafe-archive rejection
        run: python3 tests/test_inspect_bonus_metadata.py -v
