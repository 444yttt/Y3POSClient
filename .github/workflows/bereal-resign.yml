name: BeReal493 Ad Hoc signing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bereal-resign.yml'
      - 'scripts/bereal-resign.py'
      - 'bereal-signing-input.json'
      - 'delivery-recipient.pem'
      - 'bereal-prepare-input-only.flag'
      - 'scripts/bereal-access-diagnostics.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: bereal493-signing
  cancel-in-progress: false
jobs:
  resign:
    if: ${{ github.repository == '444yttt/Y3POSClient' && github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Inspect existing provisioning or sign the authenticated input
        if: ${{ !contains(github.event.head_commit.message, '[bereal-access-only]') }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 || secrets.DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD || secrets.DIST_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f bereal-signing-input.json ]]; then
            if [[ -f bereal-prepare-input-only.flag ]]; then
              bereal_input_version=$(python3 -c 'import json; print(json.load(open("bereal-signing-input.json"))["version"])')
              if [[ "$bereal_input_version" == 3 ]]; then
                python3 scripts/bereal-resign.py --verify-input
              else
                python3 scripts/bereal-resign.py --prepare-input
              fi
            else
              python3 scripts/bereal-resign.py
            fi
          else
            python3 scripts/bereal-resign.py --probe-existing-profiles
          fi
      - name: Inspect existing Apple provisioning access without writes
        if: ${{ always() && hashFiles('scripts/bereal-access-diagnostics.py') != '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 || secrets.DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD || secrets.DIST_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          BEREAL_ALT_CERTIFICATE_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          BEREAL_ALT_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: python3 scripts/bereal-access-diagnostics.py
      - name: Save authenticated encrypted original for continuation
        if: ${{ always() && hashFiles('bereal-prepare-input-only.flag') != '' && hashFiles('bereal-input-transfer/input-metadata.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BeReal493-encrypted-input-${{ github.sha }}
          path: bereal-input-transfer/
          retention-days: 30
          if-no-files-found: warn
      - name: Save encrypted unsigned verification package
        if: ${{ hashFiles('bereal-prepare-input-only.flag') != '' && hashFiles('bereal-output/BeReal493-unsigned-delivery.cms') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BeReal493-unsigned-encrypted-${{ github.sha }}
          path: bereal-output/BeReal493-unsigned-delivery.cms
          retention-days: 30
          if-no-files-found: error
      - name: Save only the encrypted signed delivery
        if: ${{ hashFiles('bereal-signing-input.json') != '' && hashFiles('bereal-prepare-input-only.flag') == '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BeReal493-signed-encrypted-${{ github.sha }}
          path: bereal-output/BeReal493-signed-delivery.cms
          retention-days: 30
          if-no-files-found: error
      - name: Save public provisioning readiness
        if: ${{ always() && hashFiles('bereal-public/*.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BeReal493-provisioning-readiness-${{ github.sha }}
          path: bereal-public/
          retention-days: 30
          if-no-files-found: warn
