name: BeReal493 Ad Hoc signing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bereal-resign.yml'
      - 'scripts/bereal-resign.py'
      - 'bereal-signing-input.json'
      - 'delivery-recipient.pem'
permissions:
  contents: read
concurrency:
  group: bereal493-signing
  cancel-in-progress: false
jobs:
  resign:
    if: ${{ github.repository == '444yttt/Y3POSClient' && github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare profiles or sign the authenticated input
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 || secrets.DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD || secrets.DIST_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f bereal-signing-input.json ]]; then
            python3 scripts/bereal-resign.py
          else
            python3 scripts/bereal-resign.py --prepare-profiles
          fi
      - name: Save only the encrypted signed delivery
        if: ${{ hashFiles('bereal-signing-input.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BeReal493-signed-encrypted-${{ github.sha }}
          path: bereal-output/BeReal493-signed-delivery.cms
          retention-days: 30
          if-no-files-found: error
      - name: Save public provisioning readiness
        if: ${{ hashFiles('bereal-signing-input.json') == '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BeReal493-provisioning-readiness-${{ github.sha }}
          path: bereal-public/
          retention-days: 30
          if-no-files-found: error
