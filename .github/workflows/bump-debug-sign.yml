name: Bump location debugger signing
on:
  push:
    branches: [main]
    paths:
      - 'scripts/bump-resign.py'
      - 'bump-signing-input.json'
      - 'bump-delivery-recipient.pem'
      - 'bump-inventory-existing.flag'
      - 'bump-reuse-wildcard.flag'
      - '.github/workflows/bump-debug-sign.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bump-location-debug-signing
  cancel-in-progress: false
jobs:
  signing:
    if: ${{ github.repository == '444yttt/Y3POSClient' && github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install authenticated input dependency
        run: python3 -m pip install --disable-pip-version-check cryptography==50.0.0
      - name: Verify signer contracts
        run: |
          python3 -m unittest discover -s bump-debug/tests -p test_signer.py -v
          python3 -m unittest discover -s bump-debug/tests -p test_inventory.py -v
          python3 -m unittest discover -s bump-debug/tests -p test_ci_scope.py -v
          python3 -m unittest discover -s bump-debug/tests -p test_existing_wildcard.py -v
      - name: Verify final native source before signing
        if: ${{ hashFiles('bump-signing-input.json') != '' }}
        working-directory: bump-debug
        run: |
          python3 -m unittest discover -s tests -v
          bash scripts/test-hooks-macos.sh
      - name: Prepare existing signing assets or sign authenticated input
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 || secrets.DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD || secrets.DIST_P12_PASSWORD }}
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -f bump-reuse-wildcard.flag ]]; then
            python3 scripts/bump-resign.py --prepare-existing-wildcard
          elif [[ -f bump-inventory-existing.flag ]]; then
            python3 scripts/bump-resign.py --inventory-existing
          elif [[ -f bump-signing-input.json ]]; then
            python3 scripts/bump-resign.py
          else
            python3 scripts/bump-resign.py --prepare
          fi
      - name: Save only public input encryption key and readiness
        if: ${{ hashFiles('bump-public/*') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BumpLocationDebug-signing-readiness-${{ github.sha }}
          path: bump-public/
          retention-days: 7
          if-no-files-found: error
      - name: Save only recipient-encrypted signed delivery
        if: ${{ hashFiles('bump-output/BumpLocationDebug-signed.cms') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BumpLocationDebug-signed-encrypted-${{ github.sha }}
          path: bump-output/BumpLocationDebug-signed.cms
          retention-days: 7
          if-no-files-found: error
      - name: Save encrypted existing-profile inventory
        if: ${{ hashFiles('bump-output/BumpLocationDebug-profile-inventory.cms') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BumpLocationDebug-profile-inventory-${{ github.sha }}
          path: bump-output/BumpLocationDebug-profile-inventory.cms
          retention-days: 7
          if-no-files-found: error
