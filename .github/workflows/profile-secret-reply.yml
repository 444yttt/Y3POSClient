name: Publish the Encrypted Y3 POS Profile Reply

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact reviewed main commit shared with the parent
        required: true
        type: string
      parent_run_id:
        description: Exact active parent registration run
        required: true
        type: string
      parent_attempt:
        description: Exact active parent attempt
        required: true
        type: string
      encrypted_payload:
        description: Bounded Base64 age ciphertext only
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  publish-ciphertext:
    if: ${{ github.repository == '444yttt/Y3POSClient' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.sha == inputs.expected_source_sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      Y3_PROFILE_SOURCE_SHA: ${{ inputs.expected_source_sha }}
    steps:
      - name: Checkout the exact reviewed reply source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Publish only the encrypted profile reply
        env:
          Y3_PROFILE_CHECK_TOKEN: ${{ github.token }}
          Y3_PROFILE_PARENT_RUN: ${{ inputs.parent_run_id }}
          Y3_PROFILE_PARENT_ATTEMPT: ${{ inputs.parent_attempt }}
          Y3_PROFILE_ENCRYPTED_PAYLOAD: ${{ inputs.encrypted_payload }}
        run: python3 scripts/ci-register-profile.py publish-reply
