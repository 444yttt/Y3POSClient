name: Register the Dedicated Y3 POS Profile Secret

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact reviewed main commit
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: y3posclient-profile-secret-registration
  cancel-in-progress: false

jobs:
  register-profile:
    if: ${{ github.repository == '444yttt/Y3POSClient' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.sha == inputs.expected_source_sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      Y3_PROFILE_SOURCE_SHA: ${{ inputs.expected_source_sha }}
    steps:
      - name: Checkout the exact reviewed client commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Publish the encrypted one-time profile challenge
        env:
          Y3_PROFILE_CHECK_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-register-profile.py request

      - name: Validate the authenticated reply and register only the profile Secret
        env:
          Y3_PROFILE_CHECK_TOKEN: ${{ github.token }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 scripts/ci-register-profile.py register

      - name: Remove all private transport and credential files
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/ci-register-profile.py ]]; then
            python3 scripts/ci-register-profile.py cleanup
          fi
