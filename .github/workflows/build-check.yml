name: Check Y3 POS Client iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-build:
    if: ${{ github.repository == '444yttt/Y3POSClient' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout the selected main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Compile with the iOS Simulator SDK
        shell: bash
        run: |
          set -euo pipefail
          version="$(xcodebuild -version)"
          printf '%s\n' "$version"
          [[ "$(printf '%s\n' "$version" | sed -n 's/^Xcode //p')" == 16.4 ]]
          xcodebuild -quiet -project Y3Client.xcodeproj -scheme Y3Client \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/y3pos-simulator-check" \
            CODE_SIGNING_ALLOWED=NO build
