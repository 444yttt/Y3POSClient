name: Build Y3 POS Client IPA

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Approved source branch (fixed to main)
        type: string
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: y3posclient-signed-ipa
  cancel-in-progress: false

jobs:
  build-ipa:
    if: ${{ github.repository == '444yttt/Y3POSClient' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: Require the approved source branch
        working-directory: ${{ github.workspace }}
        env:
          REQUESTED_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ "$REQUESTED_SOURCE_REF" != main ]]; then
            echo '::error::Only the approved main branch can access the signing secrets.'
            exit 1
          fi

      - name: Checkout the approved client source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Compile, restore existing signing assets, and export locally
        id: signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 || secrets.DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD || secrets.DIST_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: bash scripts/ci-sign-and-export.sh

      - name: Encrypt the verified IPA for the recipient
        id: encryption
        env:
          IPA_PATH: ${{ steps.signing.outputs.ipa_path }}
          VERIFICATION_PATH: ${{ steps.signing.outputs.verification_path }}
          DELIVERY_RECIPIENT_FILE: delivery-recipient.txt
        run: bash scripts/encrypt-delivery.sh

      - name: Save the encrypted delivery package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Y3POSClient-EncryptedIPA-${{ github.run_number }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ steps.encryption.outputs.encrypted_path }}

      - name: Remove temporary signing assets
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [[ -f scripts/ci-sign-and-export.sh ]]; then
            bash scripts/ci-sign-and-export.sh --cleanup-only
          fi

  delivery-copy:
    needs: build-ipa
    if: ${{ github.repository == '444yttt/Y3POSClient' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.build-ipa.result == 'success' }}
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download this run's encrypted delivery package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Y3POSClient-EncryptedIPA-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/y3pos-release-delivery
          digest-mismatch: error

      - name: Keep an encrypted copy in a temporary draft release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          DRAFT_TAG: ci-delivery-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import stat

          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'y3pos-release-delivery'
          if directory.is_symlink() or not directory.is_dir():
              raise SystemExit('Encrypted delivery directory is missing or invalid.')
          entries = list(directory.iterdir())
          if len(entries) != 1 or entries[0].name != 'Y3POSClient.zip.age':
              raise SystemExit('Expected only the encrypted Y3POSClient.zip.age package.')
          package = entries[0]
          if not stat.S_ISREG(package.lstat().st_mode) or package.stat().st_size == 0:
              raise SystemExit('Encrypted package must be a nonempty regular file.')
          with package.open('rb') as stream:
              if stream.read(22) != b'age-encryption.org/v1\n':
                  raise SystemExit('Encrypted package has an invalid age header.')
          PY
          gh release create "$DRAFT_TAG" "$RUNNER_TEMP/y3pos-release-delivery/Y3POSClient.zip.age" \
            --repo "$REPOSITORY" --draft --target "$SOURCE_COMMIT" --latest=false \
            --title 'Y3 POS encrypted delivery (temporary)' \
            --notes 'Encrypted build delivery. Temporary draft for the recipient.'

      - name: Remove the downloaded encrypted copy
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import shutil

          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'y3pos-release-delivery'
          if directory.is_symlink():
              directory.unlink()
          elif directory.exists():
              shutil.rmtree(directory)
          PY
