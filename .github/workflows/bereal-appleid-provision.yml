name: BeReal493 temporary Apple authentication
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bereal-appleid-provision.yml'
      - '.github/actions/bereal-appleid-provision/**'
      - 'scripts/bereal-appleid-provision.*'
      - 'scripts/bereal-auth-publish-challenge.cjs'
      - 'bereal-appleid-provision-request.txt'
      - 'bereal-auth-sms-target.json'
permissions:
  contents: write
  actions: read
concurrency:
  group: bereal493-appleid-provision
  cancel-in-progress: false
jobs:
  provision:
    if: ${{ github.repository == '444yttt/Y3POSClient' && github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        with:
          ruby-version: '3.3'
      - name: Install pinned authentication and encryption dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check cryptography==46.0.3
          gem install fastlane --version 2.241.0 --no-document
          npm install --prefix "$RUNNER_TEMP/bereal-auth-tools" --no-audit --no-fund @actions/artifact@6.3.1
      - name: Verify private-input cleanup and encrypted relay without logging in
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s Tests -p test_bereal_appleid_provision.py -v
          ruby Tests/test_bereal_appleid_provision.rb
          node --check scripts/bereal-auth-publish-challenge.cjs
          node Tests/test_bereal_auth_publisher.cjs
      - name: Create scoped profiles through temporary authenticated Apple session
        uses: ./.github/actions/bereal-appleid-provision
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 || secrets.DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD || secrets.DIST_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          BEREAL_ARTIFACT_MODULE_PATH: ${{ runner.temp }}/bereal-auth-tools/node_modules/@actions/artifact
          BEREAL_CHALLENGE_GITHUB_TOKEN: ${{ github.token }}
      - name: Save only the safe provisioning result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BeReal493-AppleAuth-result-${{ github.run_id }}
          path: bereal-auth-public/result.json
          retention-days: 7
          if-no-files-found: warn
